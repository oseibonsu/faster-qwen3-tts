# Docker Compose for Blackwell GPUs (RTX 50xx)
#
# Usage:
#   docker compose -f docker-compose.blackwell.yml up --build
#
# Pre-download models first (recommended):
#   pip install huggingface_hub
#   python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-TTS-12Hz-1.7B-Base')"

services:
  tts-api:
    build:
      context: .
      dockerfile: Dockerfile.blackwell
    ports:
      - "${API_PORT:-8000}:8000"
      - "${DEMO_PORT:-7860}:7860"
    volumes:
      # HuggingFace model cache — pre-download models to avoid long first-run
      - "${HF_CACHE:-~/.cache/huggingface}:/cache"
      # Reference audio for voice cloning (mount your own)
      - "${REF_AUDIO:-./ref_audio.wav}:/app/ref_audio.wav:ro"
    environment:
      - ENTRY_MODE=${ENTRY_MODE:-api}
      - QWEN_TTS_MODEL=${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - QWEN_TTS_LANGUAGE=${QWEN_TTS_LANGUAGE:-English}
      - QWEN_TTS_REF_AUDIO=${QWEN_TTS_REF_AUDIO:-}
      - QWEN_TTS_REF_TEXT=${QWEN_TTS_REF_TEXT:-}
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      start_period: 300s
      retries: 3
