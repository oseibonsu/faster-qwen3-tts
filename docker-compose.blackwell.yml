# Docker Compose for Blackwell GPUs (RTX 50xx)
#
# Build & run:
#   docker compose -f docker-compose.blackwell.yml up --build
#
# Pre-download models first (recommended):
#   pip install huggingface_hub
#   python -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-TTS-12Hz-1.7B-Base')"

services:
  faster-qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile.blackwell
    image: faster-qwen3-tts:blackwell
    container_name: faster-qwen3-tts
    user: "root"
    stdin_open: true
    tty: true
    network_mode: host
    runtime: nvidia
    environment:
      ENTRY_MODE: "api"
      API_PORT: "8000"
      DEMO_PORT: "7860"
      QWEN_TTS_MODEL: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
      QWEN_TTS_LANGUAGE: "English"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - ~/.cache/huggingface:/cache
      - ./ref_audio.wav:/app/ref_audio.wav:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
